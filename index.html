<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งงานตู้เข้าลาน (Driver)</title>
    <!-- นำเข้า LIFF SDK ของ LINE -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f2f6; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #192a56; text-align: center; margin-top: 0; }
        label { font-weight: bold; color: #273c75; display: block; margin-top: 15px; font-size: 14px;}
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-size: 16px;}
        
        .info-box { background-color: #e8f4f8; padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 14px; color: #2f3640; border-left: 4px solid #192a56;}
        .info-box span { font-weight: bold; color: #e84118; }

        .btn-primary { background-color: #192a56; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.2s;}
        .btn-success { background-color: #44bd32; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.2s;}
        .btn-primary:disabled, .btn-success:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; color: #e84118; font-weight: bold; font-size: 14px;}
        
        /* ⭐️ ซ่อนหน้าต่างยืนยันไว้ตอนเริ่มต้น */
        #verificationSection { display: none; border-top: 2px dashed #dcdde1; padding-top: 25px; margin-top: 25px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚚 ระบบส่งงานตู้เข้าลาน</h2>

        <!-- ==========================================
             สเต็ปที่ 1: เลือก Booking และ อัปโหลดรูป
             ========================================== -->
        <div id="uploadSection">
            <label for="bookingNo">📁 เลือก Booking No.</label>
            <select id="bookingNo" onchange="showBookingDetails()" required>
                <option value="">-- กำลังโหลดข้อมูลงาน... --</option>
            </select>

            <div id="bookingDetails" class="info-box">
                ลูกค้า: <span id="dispCustomer">-</span><br>
                เอเยนต์: <span id="dispAgent">-</span><br>
                ลักษณะงาน: <span id="dispRoute">-</span>
            </div>

            <label for="imageUpload">📸 ถ่ายรูปตู้ / ซีล / ใบ EIR (เลือกพร้อมกันหลายรูป)</label>
            <input type="file" id="imageUpload" accept="image/*" multiple required>

            <button class="btn-primary" id="submitBtn" onclick="processImagesWithAI()">🤖 ส่งให้ AI ตรวจสอบข้อมูล</button>
            <div id="status">กำลังเตรียมความพร้อมระบบ... ⏳</div>
        </div>

        <!-- ==========================================
             สเต็ปที่ 2: หน้าต่างยืนยันสำหรับคนขับ 
             ========================================== -->
        <div id="verificationSection">
            <h3 style="color:#e84118; text-align:center; margin-top:0;">⚠️ โปรดตรวจสอบความถูกต้อง ⚠️<br><span style="color:#7f8fa6; font-size: 13px; font-weight: normal;">(หาก AI อ่านผิด จิ้มแก้ไขตัวเลขได้เลยค่ะ)</span></h3>
            
            <label>📦 เบอร์ตู้คอนเทนเนอร์:</label>
            <input type="text" id="verifyContainer" placeholder="เช่น MRSU1234567">
            
            <label>🔒 เลขซีล (Seal):</label>
            <input type="text" id="verifySeal" placeholder="เช่น 123456">
            
            <label>📏 ขนาดตู้ (Size):</label>
            <input type="text" id="verifySize" placeholder="เช่น 40HC">

            <button class="btn-success" id="btnSubmitFinal" onclick="submitFinalData()">✅ ข้อมูลถูกต้อง บันทึกส่งงานเลย!</button>
        </div>
    </div>

    <script>
        // 🚨 ตั้งค่า LINE LIFF ID และ Google Apps Script URL
        const MY_LIFF_ID = "2010964214-ENTz806Z"; // ใส่ LIFF ID ของพี่
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhzTE1v2fKfNM61XGa4nBn0KLe_cx-05JvfTGUNA8pW86IpTnEmeMGhlKiGPuJvk_r/exec"; 

        let userId = "Unknown";
        let displayName = "Unknown";
        let globalBookings = []; 
        let compressedImagesArray = []; 
        let aiConfidenceScore = 0; 

        // 1. เริ่มต้นระบบ LIFF และโหลด Booking
        async function initializeApp() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    displayName = profile.displayName;
                    document.getElementById("status").innerText = `สวัสดีคุณ ${displayName} 👋`;
                } else {
                    liff.login();
                }
                loadBookingNumbers(); 
            } catch (err) {
                document.getElementById("status").innerText = "LIFF Error: " + err.message;
            }
        }

        // 2. ดึงข้อมูล Booking จาก Google Sheets
        async function loadBookingNumbers() {
            try {
                const response = await fetch(GAS_WEB_APP_URL + "?action=getBooking");
                globalBookings = await response.json();
                const selectObj = document.getElementById("bookingNo");
                
                selectObj.innerHTML = '<option value="">-- เลือก Booking No --</option>';
                if (globalBookings.length > 0 && !globalBookings[0].error) {
                    globalBookings.forEach(item => {
                        let opt = document.createElement("option");
                        opt.value = item.bookingNo;
                        opt.text = item.bookingNo;
                        selectObj.add(opt);
                    });
                } else {
                    selectObj.innerHTML = '<option value="">ไม่พบข้อมูล Booking ในแผนงาน</option>';
                }
            } catch (err) {
                document.getElementById("status").innerText = "โหลดข้อมูลล้มเหลว";
            }
        }

        // 3. แสดงรายละเอียดลูกค้าเมื่อเลือก Booking
        function showBookingDetails() {
            const selectedVal = document.getElementById("bookingNo").value;
            const match = globalBookings.find(x => x.bookingNo === selectedVal);
            if (match) {
                document.getElementById("dispCustomer").innerText = match.customer || "-";
                document.getElementById("dispAgent").innerText = match.agent || "-";
                document.getElementById("dispRoute").innerText = match.route || "-";
            } else {
                document.getElementById("dispCustomer").innerText = "-";
                document.getElementById("dispAgent").innerText = "-";
                document.getElementById("dispRoute").innerText = "-";
            }
        }

        // 4. ระบบวิชามาร: ย่อขนาดรูปภาพก่อนส่ง (เคล็ดลับความเร็ว)
        function compressImage(file, maxSize = 800) {
            return new Promise((resolve) => {
                let reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    let img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        
                        // คำนวณอัตราส่วนให้ไม่เกิน maxSize
                        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } 
                        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // แปลงกลับเป็น Base64 แบบบีบอัดคุณภาพ 70%
                        let dataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                        resolve({
                            mimeType: 'image/jpeg',
                            base64: dataUrl.split(',')[1]
                        });
                    };
                };
            });
        }

        // 5. สเต็ปที่ 1: ส่งรูปไปให้ AI อ่าน
        async function processImagesWithAI() {
            const bNo = document.getElementById("bookingNo").value;
            const fileInput = document.getElementById("imageUpload");
            
            if (!bNo) return alert("กรุณาเลือก Booking ก่อนค่ะ");
            if (fileInput.files.length === 0) return alert("กรุณาเลือกรูปภาพอย่างน้อย 1 รูปค่ะ");

            // ซ่อนปุ่ม และโชว์สถานะโหลด
            document.getElementById("submitBtn").style.display = "none";
            document.getElementById("status").style.display = "block";
            document.getElementById("status").innerHTML = "⏳ กำลังส่งรูปให้ AI วิเคราะห์... <br><small>(ใช้เวลาประมาณ 5-10 วินาที)</small>";

            // บีบอัดรูปทั้งหมดในคราวเดียว
            compressedImagesArray = [];
            for (let i = 0; i < fileInput.files.length; i++) {
                compressedImagesArray.push(await compressImage(fileInput.files[i]));
            }

            try {
                // ส่งรูปไปหา GAS โหมด 'LIFF_ANALYZE'
                let response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ source: "LIFF_ANALYZE", images: compressedImagesArray })
                });
                let result = await response.json();
                
                if(result.status === "success") {
                    // เอาข้อมูลที่ AI อ่านได้ มาใส่ในช่องให้คนขับดู
                    document.getElementById('verifyContainer').value = result.data.container_no || "";
                    document.getElementById('verifySeal').value = result.data.seal_no || "";
                    document.getElementById('verifySize').value = result.data.size || "";
                    aiConfidenceScore = result.data.confidence || 100;

                    // สลับหน้าจอ: ซ่อนคำว่าโหลด แล้วโชว์หน้าต่างให้กดยืนยัน
                    document.getElementById("status").style.display = "none";
                    document.getElementById('verificationSection').style.display = "block";
                } else {
                    alert("AI เกิดข้อผิดพลาดในการวิเคราะห์: " + (result.message || "Unknown Error"));
                    location.reload(); // รีเฟรชให้เริ่มใหม่
                }
            } catch(error) {
                alert("เซิร์ฟเวอร์หรือเครือข่ายมีปัญหา กรุณาลองใหม่ค่ะ");
                location.reload();
            }
        }

        // 6. สเต็ปที่ 2: คนขับกดยืนยัน ส่งข้อมูลเข้าระบบ Dashboard (จบงาน)
        async function submitFinalData() {
            let btn = document.getElementById('btnSubmitFinal');
            btn.innerText = "กำลังบันทึกงานเข้าบริษัท... ⏳";
            btn.disabled = true;

            const selectedVal = document.getElementById("bookingNo").value;
            const match = globalBookings.find(x => x.bookingNo === selectedVal);

            // ประกอบร่างข้อมูลที่คนขับแก้ไขแล้ว (Verified)
            let payload = {
                source: "LIFF_SUBMIT",
                bookingNo: selectedVal,
                customer: match ? match.customer : "-",
                agent: match ? match.agent : "-",
                displayName: displayName,
                userId: userId,
                images: compressedImagesArray,
                verifiedContainer: document.getElementById('verifyContainer').value,
                verifiedSeal: document.getElementById('verifySeal').value,
                verifiedSize: document.getElementById('verifySize').value,
                confidence: aiConfidenceScore
            };

            try {
                // ส่งไปหา GAS โหมด 'LIFF_SUBMIT' (บันทึกลงชีท + เซฟรูปลง Drive)
                let response = await fetch(GAS_WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                let result = await response.json();

                if (result.status === "success") {
                    // ⭐️ แจ้งเตือนความสำเร็จและปิดแอปทันที
                    alert("🎉 บันทึกข้อมูลและส่งงานเรียบร้อยแล้วค่ะ!");
                    liff.closeWindow(); 
                } else {
                    throw new Error("เซิร์ฟเวอร์ปฏิเสธการบันทึก");
                }
            } catch(e) {
                alert("เกิดข้อผิดพลาดในการบันทึกค่ะ กรุณาลองกดอีกครั้ง");
                btn.innerText = "✅ ข้อมูลถูกต้อง บันทึกส่งงานเลย!";
                btn.disabled = false;
            }
        }

        // เริ่มโหลดแอป
        initializeApp();
    </script>
</body>
</html>
