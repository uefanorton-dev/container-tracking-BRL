<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver ส่งงานตู้</title>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 8px; color: #555; }
    select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Kanit', sans-serif; font-size: 16px; background-color: #fff; }
    
    /* กล่องโชว์รายละเอียดงาน (ดีไซน์ใหม่) */
    .info-box { background-color: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14.5px; border-left: 4px solid #1976d2; display: none; line-height: 1.6;}
    .info-box span { font-weight: bold; color: #1565c0; }
    
    button { width: 100%; padding: 14px; background-color: #00B900; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status { margin-top: 20px; text-align: center; color: #666; font-size: 14px; padding: 10px; border-radius: 6px; background-color: #f8f9fa; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div class="container">
    <h2>🚚 ส่งงานตู้ / ซีล</h2>
    
    <label for="bookingNo">เลข Booking No.</label>
    <!-- เพิ่มคำสั่ง onchange เพื่อดึงข้อมูลมาแสดงทันทีที่คลิกเลือก -->
    <select id="bookingNo" onchange="showBookingDetails()" required>
      <option value="" disabled selected>⏳ กำลังโหลดข้อมูลงาน...</option>
    </select>
    
    <!-- กล่องที่จะโชว์ ลูกค้า, เอเยนต์, ลักษณะงาน -->
    <div id="bookingDetails" class="info-box">
      ลูกค้า: <span id="dispCustomer">-</span><br>
      เอเยนต์: <span id="dispAgent">-</span><br>
      ลักษณะงาน: <span id="dispRoute">-</span>
    </div>
    
    <label for="imageUpload">ถ่ายรูปตู้ / ซีล (เลือกได้หลายรูป)</label>
    <input type="file" id="imageUpload" accept="image/*" multiple required>
    
    <button id="submitBtn" onclick="submitData()">ส่งให้ AI ประมวลผล</button>
    <div id="status">กำลังเตรียมความพร้อมระบบ... ⏳</div>
  </div>

  <script>
    const MY_LIFF_ID = "2010964214-ENTz806Z"; 
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxN5iVe8CWJJP5PxVQWYw98RZdiSpfG78S37tlkVUXkp-S8M73T2G1ZV4Dd8CGSMENx/exec"; 

    let userId = "Unknown";
    let displayName = "Unknown";
    let globalBookings = []; // ตัวแปรเก็บข้อมูลตารางแบบ Global

    // ==========================================
    // 1. ดึงข้อมูลแบบ Object (มีครบทั้ง Booking, Customer, Agent)
    // ==========================================
    async function loadBookingNumbers() {
      const selectElement = document.getElementById("bookingNo");
      try {
        const response = await fetch(GAS_WEB_APP_URL + "?action=getBooking");
        globalBookings = await response.json(); 
        
        selectElement.innerHTML = '<option value="" disabled selected>-- เลือกเลข Booking --</option>';
        
        if(globalBookings.length === 0 || globalBookings[0].error) {
           selectElement.innerHTML = '<option value="" disabled>⚠️ ไม่มีงาน / ไม่พบชีท</option>';
           return;
        }

        // วนลูปสร้าง Dropdown
        globalBookings.forEach(item => {
          let option = document.createElement("option");
          option.value = item.bookingNo;
          option.textContent = item.bookingNo;
          selectElement.appendChild(option);
        });

      } catch (err) {
        selectElement.innerHTML = '<option value="">⚠️ โหลดข้อมูลล้มเหลว</option>';
      }
    }

    // ==========================================
    // 2. ฟังก์ชันโชว์รายละเอียดเมื่อคนขับเลือก Dropdown
    // ==========================================
    function showBookingDetails() {
      const selectedNo = document.getElementById('bookingNo').value;
      const detailsDiv = document.getElementById('bookingDetails');
      
      // ค้นหาข้อมูลในชุดข้อมูล Global
      const info = globalBookings.find(b => b.bookingNo === selectedNo);
      
      if(info) {
        document.getElementById('dispCustomer').innerText = info.customer || "-";
        document.getElementById('dispAgent').innerText = info.agent || "-";
        document.getElementById('dispRoute').innerText = info.route || "-";
        detailsDiv.style.display = "block"; // แสดงกล่อง
      } else {
        detailsDiv.style.display = "none";  // ซ่อนกล่อง
      }
    }

    // ==========================================
    // 3. ระบบเริ่มต้น LIFF (ดึงชื่อ-นามสกุล Line)
    // ==========================================
    async function initializeLiff() {
      const statusDiv = document.getElementById("status");
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          statusDiv.innerHTML = "กำลังสลับไปยังหน้าต่างล็อกอิน...";
          liff.login({ redirectUri: window.location.href });
          return;
        } 
        const profile = await liff.getProfile();
        userId = profile.userId;
        displayName = profile.displayName; 
        
        statusDiv.innerHTML = "✅ พร้อมทำงาน (คนขับ: " + displayName + ")";
        statusDiv.style.backgroundColor = "#e8f5e9";
        statusDiv.style.color = "#2e7d32";

      } catch (err) {
        statusDiv.innerHTML = "❌ ระบบ LIFF มีปัญหา: " + err.message;
      }
    }

    window.onload = () => {
      initializeLiff();
      loadBookingNumbers();
    };

    // ==========================================
    // 4. ส่งข้อมูลให้ GAS
    // ==========================================
    async function submitData() {
      const bookingNo = document.getElementById('bookingNo').value;
      const fileInput = document.getElementById('imageUpload');
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');

      if (!bookingNo || fileInput.files.length === 0) {
        alert("⚠️ กรุณาเลือก Booking No. และแนบรูปภาพ");
        return;
      }

      // ดึง Customer และ Agent ส่งแนบไปด้วย จะได้ประหยัดแรง GAS ไม่ต้องไปงมหาอีกรอบ
      const info = globalBookings.find(b => b.bookingNo === bookingNo) || {};

      submitBtn.disabled = true;
      submitBtn.innerHTML = "กำลังประมวลผล... (ห้ามปิดหน้าจอ)";
      statusDiv.innerHTML = "กำลังแปลงไฟล์ภาพ... ⏳";

      try {
        let imagesArray = [];
        for (let i = 0; i < fileInput.files.length; i++) {
          let base64 = await fileToJSON(fileInput.files[i]);
          imagesArray.push(base64);
        }

        const payload = {
          source: "LIFF",
          userId: userId,
          displayName: displayName, // ชื่อไลน์ของจริง
          bookingNo: bookingNo,
          customer: info.customer || "", // ส่งชื่อลูกค้าไปบันทึก
          agent: info.agent || "",       // ส่งชื่อเอเยนต์ไปบันทึก
          images: imagesArray
        };

        statusDiv.innerHTML = "กำลังส่งข้อมูลเข้าสู่โมเดล Gemini 3.1 Pro... 🚀";

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          statusDiv.innerHTML = "✅ บันทึกลงระบบสำเร็จ!";
          alert("ส่งงานเรียบร้อย สามารถปิดหน้านี้ได้เลยครับ");
          liff.closeWindow(); 
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        statusDiv.innerHTML = "❌ ล้มเหลว: " + error.message;
        submitBtn.disabled = false;
        submitBtn.innerHTML = "ลองส่งใหม่อีกครั้ง";
      }
    }

    function fileToJSON(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ mimeType: file.type, base64: reader.result.split(',')[1] });
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
