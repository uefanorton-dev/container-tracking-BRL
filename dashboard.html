<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Dashboard - ยี่หวา Logistics</title>
    <style>
        /* ================= ตกแต่งหน้าตา (CSS) ================= */
        :root { --primary: #2c3e50; --secondary: #34495e; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header h1 { color: var(--primary); margin: 0 0 10px 0; }
        .status-badge { background: #2ecc71; color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* โครงสร้างการ์ด Booking */
        .booking-card { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; overflow: hidden; border-left: 5px solid var(--accent); }
        .booking-header { background: var(--secondary); color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; }
        
        /* ตารางรายการตู้ */
        .container-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; padding: 15px; }
        .container-item { border: 1px solid #e0e6ed; border-radius: 8px; padding: 15px; background: #fafbfc; position: relative; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .info-label { font-weight: bold; color: #7f8c8d; }
        .info-value { color: var(--primary); font-weight: bold; }
        
        /* จัดการรูปภาพ (Thumbnails) */
        .image-gallery { display: flex; gap: 10px; margin-top: 15px; }
        .img-box { flex: 1; text-align: center; }
        .img-box img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: zoom-in; transition: 0.2s; }
        .img-box img:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-color: var(--accent); }
        .img-box p { margin: 5px 0 0 0; font-size: 11px; color: #95a5a6; font-weight: bold; }

        /* ระบบ Modal (รูปขยายใหญ่) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; margin-top: 2%; border-radius: 8px; }
        .close-modal { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ส่วนหัวกระดาน -->
    <div class="header">
        <h1>🚚 Dispatcher Dashboard</h1>
        <span class="status-badge" id="sync-status">🟢 ระบบกำลังซิงค์ข้อมูล Real-time...</span>
    </div>

    <!-- พื้นที่สำหรับวาดการ์ดข้อมูล -->
    <div id="dashboard-container">
        <p style="text-align:center; color:#7f8c8d;">กำลังดึงข้อมูลจากฐานข้อมูล...</p>
    </div>

    <!-- หน้าต่าง Modal สำหรับขยายรูป -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <script>
        /* ================= ระบบการทำงาน (JavaScript) ================= */
        
        // 🚨 เอา Web App URL (New Version) ของพี่มาวางในเครื่องหมายคำพูดด้านล่างนี้เลยค่ะ 🚨
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxAcwKlT2-C-sqrXgOquHONs3AfcAzTpFibEOUravAWt5lJhyJwwrj722VUpYzd7hHD/exec"; 

        // 1. ฟังก์ชันดึงข้อมูลแบบ Real-time (AJAX Fetch)
        async function fetchDashboardData() {
            try {
                // วิ่งไปขอข้อมูลจาก GAS โดยระบุ action=getDashboardData
                const response = await fetch(GAS_API_URL + "?action=getDashboardData");
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('sync-status').innerText = "🔴 ขาดการเชื่อมต่อ (กำลังพยายามใหม่...)";
                document.getElementById('sync-status').style.background = "#e74c3c";
            }
        }

        // 2. ฟังก์ชันวาดข้อมูลลงหน้าจอ (DOM Manipulation)
        function renderDashboard(data) {
            document.getElementById('sync-status').innerText = "🟢 อัปเดตข้อมูลล่าสุดเมื่อ: " + new Date().toLocaleTimeString();
            document.getElementById('sync-status').style.background = "#2ecc71";
            
            const container = document.getElementById('dashboard-container');
            let html = '';

            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center;">🎉 ไม่มีงานค้างในระบบค่ะ</p>';
                return;
            }

            // วนลูปวาดกล่อง Booking
            data.forEach(booking => {
                html += `
                <div class="booking-card">
                    <div class="booking-header">
                        <span>📁 Booking: ${booking.bookingNo}</span>
                        <span>ลูกค้า: ${booking.customer} | รวม ${booking.containers.length} ตู้</span>
                    </div>
                    <div class="container-grid">`;
                
                // วนลูปวาดตู้คอนเทนเนอร์ไว้ใน Booking
                booking.containers.forEach(cont => {
                    html += `
                        <div class="container-item">
                            <div class="info-row"><span class="info-label">📦 เบอร์ตู้:</span> <span class="info-value">${cont.containerNo} (${cont.size})</span></div>
                            <div class="info-row"><span class="info-label">🔒 ซีล:</span> <span class="info-value">${cont.sealNo}</span></div>
                            <div class="info-row"><span class="info-label">⏰ เวลา:</span> <span class="info-value">${cont.timestamp}</span></div>
                            <div class="info-row"><span class="info-label">🤖 AI มั่นใจ:</span> <span class="info-value">${cont.status === 'Approved' ? '✅ ผ่าน' : '⚠️ รอตรวจสอบ'}</span></div>
                            
                            <div class="image-gallery">`;
                    
                    // สร้างปุ่มดูรูปภาพ (ส่ง URL เข้าฟังก์ชันเปิด Modal)
                    if(cont.picFront) html += `<div class="img-box"><img src="${cont.picFront}" onclick="openModal('${cont.picFront}')"><p>หน้าตู้</p></div>`;
                    if(cont.picSeal) html += `<div class="img-box"><img src="${cont.picSeal}" onclick="openModal('${cont.picSeal}')"><p>ซีล</p></div>`;
                    if(cont.picEIR) html += `<div class="img-box"><img src="${cont.picEIR}" onclick="openModal('${cont.picEIR}')"><p>EIR</p></div>`;
                    
                    html += `</div></div>`;
                });
                
                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        // 3. ฟังก์ชันระบบจัดการรูปภาพ (Modal Zoom)
        function openModal(imgUrl) {
            document.getElementById("imageModal").style.display = "block";
            document.getElementById("expandedImg").src = imgUrl;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        // 4. หัวใจความ Real-time (AJAX Polling)
        fetchDashboardData(); // ดึงข้อมูลทันทีเมื่อโหลดหน้าเว็บ
        setInterval(fetchDashboardData, 5000); // สั่งให้รีเฟรชข้อมูลเองทุกๆ 5 วินาที
        
    </script>
</body>
</html>
