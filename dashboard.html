<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRL Dispatcher Dashboard</title>
    <style>
        /* ================= ธีมบริษัท บูรพารุ่งโรจน์ โลจิสติกส์ ================= */
        :root { 
            --primary: #0a3d62; /* สีน้ำเงินกรมท่า */
            --secondary: #3c6382; 
            --accent: #e55039; /* สีส้ม/แดง โลจิสติกส์ */
            --bg: #f1f2f6; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .header img { height: 60px; } /* ขนาดโลโก้ */
        .header-text h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 24px; }
        .status-badge { background: #2ecc71; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        
        /* โครงสร้างการ์ด Booking */
        .booking-card { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; overflow: hidden; border-left: 5px solid var(--primary); }
        .booking-header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .booking-title { font-size: 18px; font-weight: bold; }
        
        /* ชุดปุ่มกด */
        .action-group { display: flex; align-items: center; gap: 15px; }
        .btn-send { background-color: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-send:hover { background-color: #c0392b; transform: translateY(-2px); }
        
        /* สวิตช์ Auto (Toggle) */
        .toggle-wrapper { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* ตารางรายการตู้ */
        .container-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; padding: 15px; }
        .container-item { border: 1px solid #e0e6ed; border-radius: 8px; padding: 15px; background: #fafbfc; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .info-label { font-weight: bold; color: #7f8c8d; }
        .info-value { color: var(--primary); font-weight: bold; }
        
        /* รูปภาพ */
        .image-gallery { display: flex; gap: 10px; margin-top: 15px; }
        .img-box { flex: 1; text-align: center; }
        .img-box img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: zoom-in; transition: 0.2s; }
        .img-box img:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-color: var(--accent); }
        .img-box p { margin: 5px 0 0 0; font-size: 11px; color: #95a5a6; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; margin-top: 2%; border-radius: 8px; }
        .close-modal { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <!-- ดึงโลโก้จาก GitHub ของพี่โดยตรง -->
        <img src="https://uefanorton-dev.github.io/burapa-rungroj-logistics/img/logo.png" alt="BRL Logo" onerror="this.style.display='none'">
        <div class="header-text">
            <h1>Burapa Rungroj Logistics Dashboard</h1>
            <span class="status-badge" id="sync-status">🟢 ระบบกำลังซิงค์ข้อมูล Real-time...</span>
        </div>
    </div>

    <div id="dashboard-container">
        <p style="text-align:center; color:#7f8c8d;">กำลังดึงข้อมูลจากฐานข้อมูล...</p>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <script>
        // 🚨 เอา Web App URL ที่ก๊อปปี้มา วางตรงนี้เลยค่ะ 🚨
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxI4jEew4rYNF_pklx_mHW-oUdmVsZ4YL1iQuquIyXfljAiLelBUuXCOc1Nv8pO1RE-/exec"; 

        async function fetchDashboardData() {
            try {
                const response = await fetch(GAS_API_URL + "?action=getDashboardData");
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('sync-status').innerText = "🔴 ขาดการเชื่อมต่อ (กำลังพยายามใหม่...)";
                document.getElementById('sync-status').style.background = "#e74c3c";
            }
        }

        function renderDashboard(data) {
            document.getElementById('sync-status').innerText = "🟢 อัปเดตล่าสุด: " + new Date().toLocaleTimeString();
            document.getElementById('sync-status').style.background = "#2ecc71";
            
            const container = document.getElementById('dashboard-container');
            let html = '';

            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center;">🎉 ไม่มีงานค้างในระบบค่ะ</p>';
                return;
            }

            data.forEach(booking => {
                // เช็กสถานะ Auto-send จาก LocalStorage ของเบราว์เซอร์
                const isAutoOn = localStorage.getItem('auto_send_' + booking.bookingNo) === 'true';
                
                html += `
                <div class="booking-card">
                    <div class="booking-header">
                        <div class="booking-title">📁 Booking: ${booking.bookingNo} <br> <span style="font-size:14px; color:#bdc3c7;">ลูกค้า: ${booking.customer} | รวม ${booking.containers.length} ตู้</span></div>
                        
                        <!-- ⭐️ ส่วนเพิ่มปุ่มกดสั่งงาน -->
                        <div class="action-group">
                            <div class="toggle-wrapper">
                                Auto-Send
                                <label class="switch">
                                    <input type="checkbox" onchange="toggleAutoSend(this, '${booking.bookingNo}')" ${isAutoOn ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <button class="btn-send" onclick="sendToCustomer('${booking.bookingNo}')">
                                🚀 ส่งให้ลูกค้า
                            </button>
                        </div>

                    </div>
                    <div class="container-grid">`;
                
                booking.containers.forEach(cont => {
                    html += `
                        <div class="container-item">
                            <div class="info-row"><span class="info-label">📦 ตู้:</span> <span class="info-value">${cont.containerNo} (${cont.size})</span></div>
                            <div class="info-row"><span class="info-label">🔒 ซีล:</span> <span class="info-value">${cont.sealNo}</span></div>
                            <div class="info-row"><span class="info-label">⏰ เวลา:</span> <span class="info-value">${cont.timestamp}</span></div>
                            <div class="info-row"><span class="info-label">🤖 AI:</span> <span class="info-value">${cont.status === 'Approved' ? '✅ ผ่าน' : '⚠️ รอตรวจ'}</span></div>
                            
                            <div class="image-gallery">`;
                    
                    if(cont.picFront) html += `<div class="img-box"><img src="${cont.picFront}" onclick="openModal('${cont.picFront}')"><p>หน้าตู้</p></div>`;
                    if(cont.picSeal) html += `<div class="img-box"><img src="${cont.picSeal}" onclick="openModal('${cont.picSeal}')"><p>ซีล</p></div>`;
                    if(cont.picEIR) html += `<div class="img-box"><img src="${cont.picEIR}" onclick="openModal('${cont.picEIR}')"><p>EIR</p></div>`;
                    
                    html += `</div></div>`;
                });
                
                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        // ================= ระบบจัดการปุ่มกด =================

        // 1. ระบบยืนยันการเปิด Auto-send
        function toggleAutoSend(checkbox, bookingNo) {
            if (checkbox.checked) {
                // ถ้ากดเปิด ให้เด้งหน้าต่างถามก่อน
                let confirmAction = confirm(`⚠️ คุณแน่ใจหรือไม่?\n\nต้องการเปิดโหมด "Auto-Send" สำหรับ Booking: ${bookingNo} \nหากมีตู้ของ Booking นี้เข้ามา ระบบจะส่งข้อมูลเข้ากลุ่ม LINE ลูกค้าทันทีโดยไม่ง้อคนตรวจ!`);
                
                if (confirmAction) {
                    localStorage.setItem('auto_send_' + bookingNo, 'true'); // บันทึกการตั้งค่าลงเบราว์เซอร์
                    alert(`✅ เปิดระบบ Auto-Send สำหรับ Booking: ${bookingNo} เรียบร้อยแล้ว`);
                } else {
                    checkbox.checked = false; // ยกเลิกการเปิด ถ้ากด Cancel
                }
            } else {
                // ถ้ากดปิด ปิดได้เลยไม่ต้องถาม
                localStorage.setItem('auto_send_' + bookingNo, 'false');
            }
        }

        // 2. ระบบกดส่งให้ลูกค้าแบบ Manual
        function sendToCustomer(bookingNo) {
            let confirmSend = confirm(`ยืนยันการส่งสรุปงาน Booking: ${bookingNo} ให้ลูกค้าใช่ไหมคะ?`);
            if (confirmSend) {
                alert(`🚀 กำลังส่งข้อมูล Booking: ${bookingNo} ไปยังกลุ่ม LINE ลูกค้า... (เชื่อมต่อ API ในอนาคต)`);
                // โค้ดตรงนี้เดี๋ยวเราจะมาเขียนเชื่อมให้ยิง LINE Notify กันในสเต็ปต่อไปค่ะ
            }
        }

        // ================= ระบบจัดการรูปภาพ =================
        function openModal(imgUrl) { document.getElementById("imageModal").style.display = "block"; document.getElementById("expandedImg").src = imgUrl; }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }

        // เริ่มดึงข้อมูล และตั้งเวลา Refresh ทุกๆ 5 วินาที
        fetchDashboardData();
        setInterval(fetchDashboardData, 5000);
        
    </script>
</body>
</html>
